<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de Obra | Aldo Puga</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Manrope:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .seccion-detalle { padding: 180px 0 120px 0; }
        .detalle-cabecera { margin-bottom: 40px; border-bottom: 1px solid var(--border-subtle); padding-bottom: 35px; }
        .detalle-cabecera h1 { font-family: 'Playfair Display', serif; font-size: clamp(35px, 5vw, 55px); margin-bottom: 15px; }
        
        .sub-galeria-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 40px; }
        .sub-galeria-item { aspect-ratio: 4 / 3; border-radius: 6px; overflow: hidden; background: var(--card-bg); border: 1px solid var(--border-subtle); cursor: pointer; transition: 0.3s; display: none; }
        .sub-galeria-item.visible { display: block; }
        .sub-galeria-item:hover { transform: translateY(-4px); border-color: var(--accent-gold); }
        .sub-galeria-item img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
        .sub-galeria-item:hover img { transform: scale(1.05); }

        @media (max-width: 900px) { .sub-galeria-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="logo"><a href="index.html">ALDO PUGA</a></div>
        <nav class="nav-links">
            <a href="index.html">Inicio</a>
            <a href="nosotros.html">Nosotros</a>
            <a href="servicios.html">Servicios</a>
            <a href="proyectos.html">Proyectos</a>
            <a href="galeria.html">Galería</a>
            <a href="equipo.html">Equipo</a>
            <a href="contacto.html">Contacto</a>
        </nav>
    </header>

    <section class="seccion-detalle">
        <div class="contenedor">
            <div class="detalle-cabecera">
                <span class="subtitulo" id="catObra">Proyecto Residencial</span>
                <h1 id="tituloObra">Cargando Obra...</h1>
                <p id="descObra" style="color:var(--text-muted); font-size:16px; max-width:800px; line-height:1.8;"></p>
                <a href="proyectos.html" style="display:inline-block; margin-top:20px; color:var(--accent-gold); text-decoration:none; font-size:12px; text-transform:uppercase; letter-spacing:2px;">← Volver a todos los proyectos</a>
            </div>

            <h3 style="font-family:'Playfair Display',serif; font-size:22px; color:var(--accent-gold);">Galería Fotográfica de la Obra</h3>
            <div class="sub-galeria-grid" id="subGaleriaGrid"></div>
        </div>
    </section>

    <div class="lightbox" id="lightbox">
        <button class="lightbox-cerrar" onclick="cerrarLightbox()">&times;</button>
        <img id="lightboxImg" src="" alt="Ampliada">
    </div>

    <footer><div class="contenedor"><p>© 2026 Aldo Puga - Arquitectura y Construcción.</p></div></footer>

    <script>
        const params = new URLSearchParams(window.location.search);
        const obra = params.get('obra') || 'pedregal';

        const baseProyectos = {
            pedregal: {
                titulo: "Proyecto Pedregal",
                cat: "Residencial Exclusivo",
                desc: "Conjunto residencial de alta gama con acabados en madera, piedra natural y ventanales de piso a techo que conectan armonicamente con terrazas privadas.",
                generarImagenes: () => {
                    let imgs = [];
                    for(let i=4; i<=18; i++) imgs.push(`Pedregal ${i}.png`);
                    return imgs;
                }
            },
            tarapoto: {
                titulo: "Proyecto Tarapoto",
                cat: "Arquitectura en Selva",
                desc: "Vivienda tropical concebida para integrarse con la vegetación nativa, utilizando techos inclinados de amplios aleros y maderas nobles.",
                generarImagenes: () => {
                    let imgs = [];
                    for(let i=1; i<=5; i++) imgs.push(`Tarapoto ${i}.png`);
                    return imgs;
                }
            },
            domingo: {
                titulo: "Santo Domingo",
                cat: "Residencial Urbano",
                desc: "Diseño volumétrico sofisticado que maximiza el espacio urbano mediante fachadas sobrias e iluminación cenital.",
                generarImagenes: () => {
                    let imgs = [];
                    for(let i=1; i<=4; i++) imgs.push(`Domingo${i}.jpg`);
                    return imgs;
                }
            },
            morin: {
                titulo: "Puerto Morín",
                cat: "Arquitectura de Playa",
                desc: "Residencia frente al mar concebida con grandes vanos de cristal templado y terrazas abiertas orientadas hacia el horizonte marino.",
                generarImagenes: () => {
                    let imgs = [];
                    for(let i=1; i<=5; i++) imgs.push(`Morin${i}.jpg`);
                    return imgs;
                }
            },
            moche: {
                titulo: "Montemar Moche",
                cat: "Exclusivo Residencial",
                desc: "Volumetría sobria rodeada de naturaleza con un juego armónico de luces, sombras y patios internos.",
                generarImagenes: () => {
                    let imgs = [];
                    for(let i=1; i<=12; i++) imgs.push(`Moche${i}.jpg`);
                    return imgs;
                }
            },
            huanchaco: {
                titulo: "Huanchaco",
                cat: "Residencial Costero",
                desc: "Propuesta arquitectónica moderna adaptada al entorno marino con amplios ventanales y terrazas exclusivas.",
                generarImagenes: () => {
                    let imgs = [];
                    for(let i=1; i<=11; i++) imgs.push(`Huanchaco${i}.png`);
                    return imgs;
                }
            }
        };

        const actual = baseProyectos[obra] || baseProyectos['pedregal'];
        document.getElementById('tituloObra').innerText = actual.titulo;
        document.getElementById('catObra').innerText = actual.cat;
        document.getElementById('descObra').innerText = actual.desc;

        const grid = document.getElementById('subGaleriaGrid');
        const fragment = document.createDocumentFragment();
        const listaObra = actual.generarImagenes();

        listaObra.forEach(nombre => {
            const item = document.createElement('div');
            item.className = 'sub-galeria-item';
            
            const img = document.createElement('img');
            img.src = `imagenes/${nombre}`;
            img.alt = actual.titulo;
            img.loading = 'lazy';
            
            img.onload = function() { item.classList.add('visible'); };
            img.onerror = function() { item.remove(); };

            item.appendChild(img);
            item.addEventListener('click', () => {
                document.getElementById('lightboxImg').src = img.src;
                document.getElementById('lightbox').classList.add('activo');
            });
            fragment.appendChild(item);
        });

        grid.appendChild(fragment);

        function cerrarLightbox() { document.getElementById('lightbox').classList.remove('activo'); }
    </script>
</body>
</html>
